<!-- ===================================================================
     Qategori Nihongo - JLPT N3 Widget
     Tempel div ini langsung ke halaman Blogger (mode HTML).
     Data (n3-kotoba*.js, n3-grammar.js, n3-quiz.js, n3-choukai.js) di-load
     dari GitHub Pages (ganti DATA_BASE di bagian <script> paling bawah).
     =================================================================== -->
<div id="n3app">
  <div class="n3-tabs" role="tablist">
    <button class="n3-tab active" data-panel="kartu">Hafalan</button>
    <button class="n3-tab" data-panel="daftar">Kosakata</button>
    <button class="n3-tab" data-panel="bunpou">Gramatika</button>
    <button class="n3-tab" data-panel="choukai">Simak</button>
    <button class="n3-tab" data-panel="reading">Bacaan</button>
    <button class="n3-tab" data-panel="mock">Ujian</button>
  </div>

  <!-- ============ PANEL 1: KARTU HAPALAN ============ -->
  <section class="n3-panel active" id="panel-kartu">
    <div class="n3-card-controls">
      <select id="kartuKategori"></select>
      <label class="n3-check"><input type="checkbox" id="kartuShowArchived"> Tampilkan yang sudah diarsipkan</label>
      <span class="n3-counter" id="kartuCounter"></span>
    </div>
    <div id="kartuStage">
      <div class="n3-flashcard" id="flashcard">
        <div class="n3-flashcard-face n3-flashcard-front">
          <div class="n3-fc-kanji" id="fcKanji"></div>
          <div class="n3-fc-kat" id="fcKat"></div>
          <div class="n3-fc-hint">Klik kartu untuk lihat arti</div>
        </div>
        <div class="n3-flashcard-face n3-flashcard-back">
          <div class="n3-fc-kana" id="fcKana"></div>
          <div class="n3-fc-arti" id="fcArti"></div>
          <div class="n3-fc-contoh" id="fcContoh"></div>
        </div>
      </div>
    </div>
    <div class="n3-card-actions">
      <button class="n3-btn n3-btn-outline" id="btnPrevCard">← Sebelumnya</button>
      <button class="n3-btn n3-btn-archive" id="btnArchive">✔ Sudah Hapal (Arsipkan)</button>
      <button class="n3-btn n3-btn-outline" id="btnUnarchive" style="display:none">↩ Batalkan Arsip</button>
      <button class="n3-btn n3-btn-primary" id="btnNextCard">Berikutnya →</button>
    </div>
  </section>

  <!-- ============ PANEL 2: DAFTAR KOTOBA ============ -->
  <section class="n3-panel" id="panel-daftar">
    <div class="n3-list-controls">
      <input type="text" id="daftarSearch" placeholder="Cari kanji / kana / arti...">
      <select id="daftarKategori"></select>
    </div>
    <div class="n3-list-wrap">
      <table class="n3-table">
        <thead><tr><th>Kanji</th><th>Kana</th><th>Romaji</th><th>Arti</th><th></th></tr></thead>
        <tbody id="daftarBody"></tbody>
      </table>
    </div>
  </section>

  <!-- ============ PANEL 3: MATERI BUNPOU (BERTAB) ============ -->
  <section class="n3-panel" id="panel-bunpou">
    <div class="n3-bab-tabs" id="babTabs"></div>
    <div id="babContent"></div>
  </section>

  <!-- ============ PANEL 4: CHOUKAI (MENDENGARKAN) ============ -->
  <section class="n3-panel" id="panel-choukai">
    <div id="choukaiHost"></div>
  </section>

  <!-- ============ PANEL 5: READING (読解) ============ -->
  <section class="n3-panel" id="panel-reading">
    <p style="font-size:.88rem;opacity:.8;margin-top:0">10 bacaan N3 berfurigana. Ketuk kanji untuk melihat arti, bacaan, susunan, dan bushu-nya.</p>
    <div id="readingHost"></div>
  </section>

  <!-- ============ PANEL 6: MOCK TEST (模擬試験) ============ -->
  <section class="n3-panel" id="panel-mock">
    <p style="font-size:.88rem;opacity:.8;margin-top:0">Simulasi ujian N3 dengan timer. Pilih durasi dan bagian soal, lalu mulai.</p>
    <div id="mockHost"></div>
  </section>
</div>

<style>
/* =====================================================================
   Tema widget ini SENGAJA tidak mendefinisikan warna teks/background-nya
   sendiri (kecuali aksen tombol & badge). Semua elemen memakai:
   - color: inherit          -> ikut warna teks tema Blogger yang aktif
   - background: transparan / abu-abu netral tembus pandang (rgba(127,127,127,x))
   - border: abu-abu netral tembus pandang
   - teks sekunder (romaji, penjelasan, dsb): pakai opacity, bukan warna
     tetap, supaya otomatis pas baik di tema terang maupun gelap.
   Jadi widget ini "menyatu" dengan tema apa pun yang dipakai di blog.
   ===================================================================== */
#n3app{max-width:760px;margin:0 auto;line-height:1.6;color:inherit;background:transparent}
#n3app, #n3app *{box-sizing:border-box}
#n3app button, #n3app select, #n3app input, #n3app table{font-family:inherit;color:inherit}
#n3app .n3-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 20px}
#n3app .n3-tab{padding:9px 16px;border-radius:99px;border:1.5px solid rgba(127,127,127,.4);font-weight:700;font-size:.88rem;cursor:pointer;background:rgba(127,127,127,.08);color:inherit}
#n3app .n3-tab.active{background:#2f7dd8;color:#fff;border-color:#2f7dd8}
#n3app .n3-tab:hover:not(.active){background:rgba(127,127,127,.18)}
#n3app .n3-panel{display:none}
#n3app .n3-panel.active{display:block}

#n3app select, #n3app input[type="text"]{padding:8px 10px;border-radius:8px;border:1.5px solid rgba(127,127,127,.4);font-size:.9rem;background:rgba(127,127,127,.08)}
#n3app .n3-card-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
#n3app .n3-check{font-size:.85rem;display:flex;align-items:center;gap:5px;cursor:pointer}
#n3app .n3-counter{font-size:.85rem;font-weight:700;opacity:.75}

#n3app .n3-flashcard{position:relative;width:100%;min-height:220px;perspective:1200px;cursor:pointer;margin:0 auto 18px}
#n3app .n3-flashcard-face{position:absolute;inset:0;border-radius:16px;border:1.5px solid rgba(127,127,127,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;backface-visibility:hidden;transition:transform .5s;background:rgba(127,127,127,.06)}
#n3app .n3-flashcard-front{transform:rotateY(0deg)}
#n3app .n3-flashcard-back{transform:rotateY(180deg);background:rgba(47,125,216,.10)}
#n3app .n3-flashcard.flipped .n3-flashcard-front{transform:rotateY(180deg)}
#n3app .n3-flashcard.flipped .n3-flashcard-back{transform:rotateY(360deg)}
#n3app .n3-fc-kanji{font-size:2.4rem;font-weight:700}
#n3app .n3-fc-kat{margin-top:10px;font-size:.8rem;color:#2f7dd8;font-weight:700;background:rgba(47,125,216,.12);padding:4px 12px;border-radius:99px;display:inline-block}
#n3app .n3-fc-hint{margin-top:16px;font-size:.78rem;opacity:.55}
#n3app .n3-fc-kana{font-size:1.3rem;font-weight:700;color:#2f7dd8}
#n3app .n3-fc-arti{margin-top:10px;font-size:1.15rem;font-weight:700}
#n3app .n3-fc-contoh{margin-top:14px;font-size:.85rem;opacity:.85}
#n3app .n3-fc-contoh .romaji{font-style:italic;opacity:.7;display:block;margin-top:2px}
#n3app .n3-fc-contoh .id{display:block;margin-top:2px}

#n3app .n3-card-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#n3app .n3-btn{padding:10px 16px;border-radius:10px;border:1.5px solid transparent;font-weight:700;font-size:.85rem;cursor:pointer}
#n3app .n3-btn-primary{background:#2f7dd8;color:#fff}
#n3app .n3-btn-primary:hover{background:#2568b8}
#n3app .n3-btn-outline{background:rgba(127,127,127,.08);border-color:rgba(127,127,127,.4);color:inherit}
#n3app .n3-btn-outline:hover{background:rgba(127,127,127,.18)}
#n3app .n3-btn-archive{background:#1a9e5c;color:#fff}
#n3app .n3-btn-archive:hover{background:#15804a}
#n3app .n3-btn:disabled{opacity:.4;cursor:not-allowed}

#n3app .n3-list-controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
#n3app .n3-list-controls input{flex:1;min-width:160px}
#n3app .n3-list-wrap{max-height:480px;overflow-y:auto;border:1.5px solid rgba(127,127,127,.3);border-radius:10px}
#n3app .n3-table{width:100%;border-collapse:collapse;font-size:.86rem}
#n3app .n3-table th{position:sticky;top:0;background:rgba(127,127,127,.15);text-align:left;padding:9px 10px;border-bottom:1.5px solid rgba(127,127,127,.35)}
#n3app .n3-table td{padding:8px 10px;border-bottom:1px solid rgba(127,127,127,.2)}
#n3app .n3-table tr:hover td{background:rgba(47,125,216,.08)}
#n3app .n3-badge-archived{font-size:.7rem;background:#1a9e5c;color:#fff;padding:2px 8px;border-radius:99px}

#n3app .n3-bab-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
#n3app .n3-bab-tab{padding:7px 12px;border-radius:8px;border:1.5px solid rgba(127,127,127,.35);font-size:.8rem;font-weight:700;cursor:pointer;background:rgba(127,127,127,.08);color:inherit}
#n3app .n3-bab-tab.active{background:#2f7dd8;color:#fff;border-color:#2f7dd8}
#n3app .n3-pola-card{border:1.5px solid rgba(127,127,127,.3);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:rgba(127,127,127,.05)}
#n3app .n3-pola-bentuk{font-size:1.1rem;font-weight:700;color:#2f7dd8}
#n3app .n3-pola-arti{font-weight:700;margin-top:2px}
#n3app .n3-pola-penjelasan{margin-top:8px;font-size:.88rem;opacity:.85}
#n3app .n3-pola-contoh{margin-top:10px;background:rgba(127,127,127,.09);border-radius:8px;padding:10px 12px}
#n3app .n3-pola-contoh .jp{font-size:.95rem}
#n3app .n3-pola-contoh .romaji{font-style:italic;opacity:.7;font-size:.85rem;display:block;margin-top:2px}
#n3app .n3-pola-contoh .id{font-size:.85rem;display:block;margin-top:2px;opacity:.85}
#n3app .n3-pola-contoh + .n3-pola-contoh{margin-top:8px}

#n3app .n3-quiz-intro{font-size:.9rem;margin-bottom:10px}
#n3app .n3-quiz-types{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
#n3app .n3-quiz-types label{font-size:.88rem;cursor:pointer}
#n3app .n3-quiz-progress{font-size:.8rem;font-weight:700;opacity:.7;margin-bottom:6px}
#n3app .n3-quiz-question{font-size:1.02rem;font-weight:700;margin-bottom:14px;white-space:pre-wrap}
#n3app .n3-quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
#n3app .n3-quiz-opt{text-align:left;padding:10px 14px;border-radius:10px;border:1.5px solid rgba(127,127,127,.35);background:rgba(127,127,127,.06);cursor:pointer;font-size:.92rem;color:inherit}
#n3app .n3-quiz-opt:hover{background:rgba(47,125,216,.1)}
#n3app .n3-quiz-opt.correct{background:rgba(26,158,92,.16);border-color:#1a9e5c;color:inherit}
#n3app .n3-quiz-opt.wrong{background:rgba(201,75,75,.16);border-color:#c94b4b;color:inherit}
#n3app .n3-quiz-opt:disabled{cursor:default}
#n3app .n3-quiz-explain{background:rgba(127,127,127,.09);border-radius:10px;padding:12px 14px;font-size:.85rem;margin-bottom:14px}

#n3app .n3-choukai-item{border:1.5px solid rgba(127,127,127,.3);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:rgba(127,127,127,.05)}
#n3app .n3-choukai-item:hover{background:rgba(47,125,216,.08)}
#n3app .n3-choukai-tipe{font-size:.72rem;font-weight:700;color:#2f7dd8;background:rgba(47,125,216,.12);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:6px}
#n3app .n3-voice-check{margin-bottom:16px}
#n3app #voiceCheckResult{margin-top:10px;font-size:.83rem;background:rgba(127,127,127,.08);border-radius:10px;padding:12px 14px}
#n3app #voiceCheckResult .n3-voice-row{padding:3px 0;border-bottom:1px solid rgba(127,127,127,.2)}
#n3app #voiceCheckResult .n3-voice-tag{font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px}
#n3app #voiceCheckResult .n3-voice-tag.L{background:rgba(47,125,216,.2);color:#2f7dd8}
#n3app #voiceCheckResult .n3-voice-tag.P{background:rgba(214,51,132,.2);color:#d63384}
#n3app #voiceCheckResult .n3-voice-tag.none{background:rgba(127,127,127,.25)}
#n3app .n3-choukai-script{margin-top:14px;background:rgba(127,127,127,.08);border-radius:10px;padding:14px}
#n3app .n3-choukai-line{margin-bottom:8px;font-size:.92rem}
#n3app .n3-choukai-line b{color:#2f7dd8}
#n3app .n3-choukai-line .romaji{display:block;font-style:italic;opacity:.65;font-size:.82rem}
</style>

<script>
/* Pemuat berurutan: tema Blogger/Qategori bisa menjalankan script secara tidak berurutan,
   jadi n3-app.js (paling akhir) baru dimuat setelah semua data dan modul selesai. */
(function(){
  var B="https://bshantoz.github.io/nihongo/", V="?v=5";
  var L=["n3/n3-kotoba.js", "n3/n3-kotoba-2.js", "n3/n3-kotoba-3.js", "n3/n3-kotoba-4.js", "n3/n3-kotoba-5.js", "n3/n3-kotoba-6.js", "n3/n3-kotoba-7.js", "n3/n3-kotoba-8.js", "n3/n3-kotoba-9.js", "n3/n3-kotoba-10.js", "n3/n3-kotoba-11.js", "n3/n3-kotoba-12.js", "n3/n3-kotoba-13.js", "n3/n3-kotoba-14.js", "n3/n3-grammar.js", "n3/n3-quiz.js", "n3/n3-choukai.js", "n3/n3-reading.js", "shared/tts.js", "shared/kanji-popup.js", "shared/choukai.js", "shared/reading.js", "shared/mock.js", "n3/n3-app.js"];
  (function next(i){
    if(i>=L.length) return;
    var s=document.createElement("script");
    s.src=B+L[i]+V; s.async=false;
    s.onload=s.onerror=function(){ next(i+1); };
    document.head.appendChild(s);
  })(0);
})();
</script>
