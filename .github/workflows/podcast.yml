name: Perbarui daftar podcast

on:
  schedule:
    - cron: '17 */6 * * *'   # tiap 6 jam
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions
  push:
    paths:
      - 'podcast/playlists.json'

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ambil daftar episode dari YouTube
        run: python podcast/update.py
      - name: Simpan kalau ada perubahan
        id: commit
        run: |
          if [ -n "$(git status --porcelain podcast/podcast.json)" ]; then
            git config user.name "podcast-bot"
            git config user.email "podcast-bot@users.noreply.github.com"
            git add podcast/podcast.json
            git commit -m "Perbarui daftar podcast"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Minta GitHub Pages terbit ulang
        if: steps.commit.outputs.changed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
