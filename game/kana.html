<style>
/* Layout: judul, pilihan aksara dan set di atas, tiga tab (Tabel, Kartu, Kuis) di bawahnya */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#1a2233; --muted:#5f6b80; --line:#d6dce8;
  --accent:#2f56b0; --accent-ink:#ffffff; --tint:#dde6f7;
  --ok:#1f7a45; --ok-bg:#d6efdf; --bad:#b3342f; --bad-bg:#f9dad7; --done:#e3f3e8;
  --font-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --surface:#1c2230; --ink:#eaeef8; --muted:#a3aec4; --line:#2f3850;
  --accent:#8fb0ff; --accent-ink:#12161f; --tint:#25304a;
  --ok:#7fdca5; --ok-bg:#173a27; --bad:#ff8c85; --bad-bg:#47201f; --done:#1c3427; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1c2230; --ink:#eaeef8; --muted:#a3aec4; --line:#2f3850;
  --accent:#8fb0ff; --accent-ink:#12161f; --tint:#25304a;
  --ok:#7fdca5; --ok-bg:#173a27; --bad:#ff8c85; --bad-bg:#47201f; --done:#1c3427; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto;display:grid;gap:14px}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.15}
h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.ctl{display:grid;gap:8px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp .lab{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sec{margin:6px 0 2px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;gap:6px}
.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px 6px;display:grid;justify-items:center;gap:0;line-height:1.15;min-height:64px}
.cell .kn{font-family:var(--font-display);font-weight:800;font-size:1.65rem}
.cell .ro{font-size:.74rem;color:var(--muted)}
.cell.dn{background:var(--done)}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell.void{visibility:hidden}
.detail{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.detail .big{font-family:var(--font-display);font-weight:800;font-size:3.4rem;line-height:1;grid-row:span 3}
.detail .rom{font-size:1.2rem;font-weight:700}
.detail .ex{font-size:.95rem}
.detail .ex b{font-family:var(--font-display);font-size:1.15rem}
.detail .mt{color:var(--muted);font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>.btn{flex:1 1 auto}
.flash{min-height:260px;display:grid;place-items:center;text-align:center;gap:6px;padding:20px 16px;cursor:pointer;user-select:none}
.flash .big{font-family:var(--font-display);font-weight:800;font-size:clamp(5rem,28vw,8.5rem);line-height:1}
.flash .rom{font-size:1.7rem;font-weight:700;color:var(--accent)}
.flash .hint{color:var(--muted);font-size:.9rem}
.count{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{display:grid;gap:12px}
.q .prompt{text-align:center;display:grid;gap:4px}
.q .big{font-family:var(--font-display);font-weight:800;font-size:clamp(4.5rem,24vw,7rem);line-height:1}
.q .ask{color:var(--muted);font-size:.9rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-weight:700;font-size:1.15rem;min-height:56px}
.opt.kn{font-family:var(--font-display);font-size:2rem;font-weight:800}
.opt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb{min-height:2.6em;text-align:center;font-size:.95rem}
.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
.res{text-align:center;display:grid;gap:10px}
.res .score{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1}
.wrongs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wrongs button{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:4px 12px;font-family:var(--font-display);font-weight:800;font-size:1.4rem}
.note{color:var(--muted);font-size:.85rem}
#view>.grp{margin-bottom:8px}#view>.count{margin-top:2px}
.foot{margin:0;color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

var selR=null;

function chartFor(set){
  var out=[],i;
  if(set==='yoon'){KANA.filter(function(r){return r.g==='yoon';}).forEach(function(r){out.push(r);});return {cols:3,cells:out};}
  var rows=set==='dasar'?ROWS_DASAR:ROWS_DAKU,list=KANA.filter(function(r){return r.g===set;}),used={};
  rows.forEach(function(row){row.forEach(function(rm){
    if(!rm){out.push(null);return;}
    var f=null;for(i=0;i<list.length;i++){if(!used[i]&&(list[i].r===rm||(rm==='wo'&&list[i].h==='を')||(rm==='di'&&list[i].h==='ぢ')||(rm==='du'&&list[i].h==='づ'))){f=list[i];used[i]=1;break;}}
    out.push(f);});});

}
function detailHtml(r){

  var e=ex(r),other=P.sc==='h'?r.k:r.h;
  var romTxt=r.h==='を'?'o (ditulis wo)':(r.h==='ぢ'?'ji (sama dengan じ)':(r.h==='づ'?'zu (sama dengan ず)':r.r));
  return '<div class="card detail"><div class="big" lang="ja">'+esc(ch(r))+'</div><div class="rom">'+esc(romTxt)+'</div>'+
    (e?'<div class="ex" lang="ja"><b>'+esc(e[0])+'</b> ('+esc(e[1])+') = '+esc(e[2])+'</div>':'<div class="ex">Jarang dipakai dalam kata sehari-hari.</div>')+
    '<div class="mt">Versi '+(P.sc==='h'?'katakana':'hiragana')+': <span lang="ja">'+esc(other)+'</span></div></div>';
}
function renderTabel(v){
  var h='<div id="det">'+detailHtml(selR&&P.sets[selR.g]?selR:null)+'</div>';
  ['dasar','dakuten','yoon'].forEach(function(s){
    if(!P.sets[s])return;
    var c=chartFor(s);
    h+='<div class="sec">'+SET_NAME[s]+'</div><div class="grid g'+c.cols+'">';
    c.cells.forEach(function(r){
      if(!r){h+='<span class="cell void"></span>';return;}
      var gi=KANA.indexOf(r);
      h+='<button type="button" class="cell'+(isDone(r)?' dn':'')+(selR===r?' sel':'')+'" data-gi="'+gi+'" aria-label="'+esc(r.r)+'"><b class="kn" lang="ja">'+esc(ch(r))+'</b><span class="ro">'+esc(r.r)+'</span></button>';
    });
    h+='</div>';
  });
  h+='<p class="note">Sel berwarna hijau = sudah kamu tandai hafal di mode Kartu.</p>';

var deck=[],pos=0,flipped=false,deckSig='';

var Q={on:false,qs:[],i:0,score:0,wrong:[],ans:false};

  var a=usable(P.mode);

  Q={on:true,qs:sh(a).slice(0,10),i:0,score:0,wrong:[],ans:false,opts:null};

}

  var a=usable(P.mode).filter(function(x){return x!==r&&(P.mode==='rom'?x.r!==r.r:ch(x)!==ch(r)&&x.r!==r.r);});
  var seen={},out=[r];seen[P.mode==='rom'?r.r:ch(r)]=1;

function answer(i){

  if((d=t.getAttribute('data-tab'))){P.tab=d;savePrefs();render();return;}
  if((d=t.getAttribute('data-mode'))){P.mode=d;Q.on=false;savePrefs();render();return;}
  if((d=t.getAttribute('data-gi'))){selR=KANA[+d];say(ch(selR));renderTabel($('#view'));return;}
  if((d=t.getAttribute('data-say'))){say(ch(KANA[+d]));return;}
  if((d=t.getAttribute('data-oi'))){answer(+d);return;}
  var id=t.id;
  if(id==='flash'){flipCard();return;}
  if(id==='kSay'){say(ch(deck[pos%deck.length]));return;}
  if(id==='kYes'){var r=deck[pos%deck.length];setDone(r,true);deck.splice(pos%deck.length,1);if(pos>=deck.length)pos=0;flipped=false;render();return;}
  if(id==='kNo'){if(deck.length>1){var x=deck.splice(pos%deck.length,1)[0];deck.push(x);if(pos>=deck.length)pos=0;}flipped=false;render();return;}
  if(id==='kHide'){P.hide=!P.hide;deckSig='';savePrefs();render();return;}
  if(id==='kRe'){deckSig='';render();return;}
  if(id==='kReset'){var keep=getDone().filter(function(s){return !pool().some(function(r){return idOf(r)===s;});});putDone(keep);deckSig='';render();return;}
  if(id==='qStart'||id==='qAgain'){startQuiz();render();return;}
  if(id==='qNext'){Q.i++;Q.ans=false;render();if(Q.i<Q.qs.length&&P.mode==='ear')say(ch(Q.qs[Q.i]));return;}
  if(id==='qHear'){say(ch(Q.qs[Q.i]));return;}
});
document.addEventListener('keydown',function(ev){
  if(P.tab==='kartu'&&(ev.key===' '||ev.key==='Enter')&&ev.target&&ev.target.id==='flash'){ev.preventDefault();flipCard();}
});
try{if(window.speechSynthesis&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',function(){});}catch(e){}
render();
</script>
